<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Premier Bank - Management System</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">
            <div class="brand-icon">$</div>
            <span>Apex Bank</span>
        </div>
        <div class="nav-user">
            <span class="user-badge">MySQL & Python Powered</span>
        </div>
    </nav>

    <div class="hero">
        <div>
            <h1 class="hero-title">Next-Gen Banking Management Engine</h1>
            <p class="hero-subtitle">Secure financial ecosystem built on Python & MySQL. Experience real-time transactions, ACID compliance, loan processing, and interactive SQL analytics.</p>
            
            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button class="btn btn-primary" onclick="fillCredentials('alex_smith', 'customer123')">Demo Customer Login</button>
                <button class="btn btn-secondary" onclick="fillCredentials('admin', 'admin123')">Demo Admin Login</button>
            </div>
        </div>

        <div class="auth-card">
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</div>
                <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Register</div>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <div id="login-error" style="color: var(--accent-rose); font-size: 13px; margin-bottom: 12px; display: none;"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="form-register" onsubmit="handleRegister(event)" style="display: none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. John Doe" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="reg-username" class="form-control" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Create password" required>
                </div>
                <div id="reg-error" style="color: var(--accent-rose); font-size: 13px; margin-bottom: 12px; display: none;"></div>
                <button type="submit" class="btn btn-emerald" style="width: 100%;">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            if (tab === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('form-register').style.display = 'none';
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('form-login').style.display = 'none';
                document.getElementById('form-register').style.display = 'block';
            }
        }

        function fillCredentials(user, pass) {
            switchAuthTab('login');
            document.getElementById('login-username').value = user;
            document.getElementById('login-password').value = pass;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errDiv = document.getElementById('login-error');
            errDiv.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errDiv.innerText = data.message;
                    errDiv.style.display = 'block';
                }
            } catch (err) {
                errDiv.innerText = 'Login error occurred.';
                errDiv.style.display = 'block';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const full_name = document.getElementById('reg-fullname').value;
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;
            const errDiv = document.getElementById('reg-error');
            errDiv.style.display = 'none';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, username, email, phone, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errDiv.innerText = data.message;
                    errDiv.style.display = 'block';
                }
            } catch (err) {
                errDiv.innerText = 'Registration error occurred.';
                errDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
